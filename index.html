<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uniden Bearcat 980 SSB - Mobile Radio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 15px;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 500px;
        }

        /* Рація корпус */
        .radio-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            border: 4px solid #3d3d3d;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 2px 5px rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
        }

        /* Ліва панель / динамік */
        .radio-left-panel {
            width: 60px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speaker-grille {
            width: 45px;
            height: 110px;
            background: repeating-linear-gradient(
                0deg,
                #111,
                #111 4px,
                #222 4px,
                #222 8px
            );
            border-radius: 6px;
            border: 1px solid #444;
        }

        /* Екран рації */
        .radio-display {
            flex-grow: 1;
            height: 140px;
            background-color: #0b0804;
            border: 3px inset #222;
            border-radius: 6px;
            margin: 0 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            box-shadow: inset 0 0 15px rgba(255, 140, 0, 0.2);
            position: relative;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #ff9900;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .display-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .s-meter {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .s-meter-bars {
            display: flex;
            gap: 2px;
        }

        .bar {
            width: 3px;
            height: 20px;
            background-color: #331a00;
            border-radius: 1px;
        }
        .bar.active {
            background-color: #ff9900;
            box-shadow: 0 0 5px #ff9900;
        }

        .channel-number {
            font-size: 42px;
            font-weight: bold;
            color: #ff9900;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.6);
            letter-spacing: 2px;
        }

        .display-footer {
            display: flex;
            justify-content: space-around;
            font-size: 9px;
            color: #cc7a00;
            font-family: monospace;
        }

        /* Права ручка */
        .radio-right-panel {
            width: 60px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .knob {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #444 0%, #222 70%, #111 100%);
            border-radius: 50%;
            border: 2px solid #555;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 12px;
            background-color: #ff9900;
            border-radius: 2px;
        }

        /* МІКРОФОН (ЗЛІВА ВІД РАЦІЇ) */
        .mic-container {
            position: absolute;
            left: -75px;
            bottom: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            transform-origin: bottom center;
        }

        .microphone {
            width: 55px;
            height: 110px;
            background: linear-gradient(135deg, #333 0%, #1c1c1c 100%);
            border: 3px solid #4f4f4f;
            border-radius: 30px 30px 12px 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            position: relative;
        }

        .mic-grille {
            width: 36px;
            height: 45px;
            background: repeating-linear-gradient(
                0deg,
                #111,
                #111 3px,
                #2a2a2a 3px,
                #2a2a2a 6px
            );
            border-radius: 6px;
            border: 1px solid #555;
        }

        .ptt-button {
            width: 30px;
            height: 28px;
            background: linear-gradient(to bottom, #222, #111);
            border: 2px solid #444;
            border-radius: 5px;
            margin-top: 12px;
            box-shadow: inset 0 2px 3px rgba(255,255,255,0.1);
        }

        /* СТАН ЗБІЛЬШЕНОГО МІКРОФОНА */
        .mic-container.expanded {
            transform: scale(1.4) translate(15px, -30px);
        }
        .mic-container.expanded .microphone {
            border-color: #ff9900;
            box-shadow: 0 12px 30px rgba(255, 153, 0, 0.4);
        }
        .mic-container.expanded .ptt-button {
            background: linear-gradient(to bottom, #ff9900, #cc7a00);
            border-color: #ffa500;
            box-shadow: 0 0 10px #ff9900;
        }

        /* ПАНЕЛЬ ВВЕДЕННЯ ПОВІДОМЛЕННЯ */
        .chat-panel {
            position: absolute;
            left: 55px;
            bottom: 25px;
            background: #1a1a1a;
            border: 2px solid #ff9900;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 20;
            width: 270px;
        }

        .chat-panel.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .chat-input {
            flex-grow: 1;
            background: #0a0a0a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            padding: 8px 10px;
            font-size: 13px;
            outline: none;
        }
        .chat-input:focus {
            border-color: #ff9900;
        }

        .send-btn {
            background: #ff9900;
            color: #111;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* Журнал передачі */
        .log-box {
            width: 100%;
            background: #181818;
            border: 2px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #aaa;
        }

        .log-item {
            margin-bottom: 6px;
            border-left: 3px solid #ff9900;
            padding-left: 8px;
            word-break: break-all;
        }
        .log-item span {
            color: #ff9900;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Рація -->
        <div class="radio-box" id="radioBox">
            
            <!-- ІНТЕРАКТИВНИЙ МІКРОФОН ЗЛІВА -->
            <div class="mic-container" id="micContainer" title="Торкніться мікрофона">
                <div class="microphone" id="micButton">
                    <div class="mic-grille"></div>
                    <div class="ptt-button"></div>
                </div>
            </div>

            <!-- РЯДОК ВВЕДЕННЯ ПОВІДОМЛЕННЯ -->
            <div class="chat-panel" id="chatPanel">
                <input type="text" id="messageInput" class="chat-input" placeholder="Повідомлення (канал 19)..." />
                <button class="send-btn" id="sendBtn">OK</button>
            </div>

            <!-- Ліва панель -->
            <div class="radio-left-panel">
                <div class="speaker-grille"></div>
            </div>

            <!-- Екран рації Uniden 980 -->
            <div class="radio-display">
                <div class="display-header">
                    <span>ANL/NB</span>
                    <span>USB</span>
                    <span>CH 19</span>
                </div>
                <div class="display-main">
                    <div class="s-meter">
                        <div class="s-meter-bars">
                            <div class="bar active"></div>
                            <div class="bar active"></div>
                            <div class="bar active"></div>
                            <div class="bar active"></div>
                            <div class="bar"></div>
                        </div>
                    </div>
                    <div class="channel-number">19</div>
                </div>
                <div class="display-footer">
                    <span>S/RF</span>
                    <span>CB/PA</span>
                    <span>MEM</span>
                </div>
            </div>

            <!-- Права ручка -->
            <div class="radio-right-panel">
                <div class="knob"></div>
            </div>
        </div>

        <!-- Журнал передачі -->
        <div class="log-box" id="logBox">
            <div class="log-item"><span>[Система]:</span> Рацію активовано на мобільному. Канал 19.</div>
        </div>
    </div>

    <script>
        const micContainer = document.getElementById('micContainer');
        const chatPanel = document.getElementById('chatPanel');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logBox = document.getElementById('logBox');

        let isExpanded = false;

        // Подія натискання / тапу по мікрофону
        micContainer.addEventListener('click', (e) => {
            e.stopPropagation();
            isExpanded = !isExpanded;

            if (isExpanded) {
                micContainer.classList.add('expanded');
                chatPanel.classList.add('active');
                messageInput.focus();
                addLog("Мікрофон знято. Ефір відкритий.");
                playRadioBeep();
            } else {
                closeMic();
            }
        });

        function closeMic() {
            isExpanded = false;
            micContainer.classList.remove('expanded');
            chatPanel.classList.remove('active');
            addLog("Мікрофон закріплено.");
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                addLog(`<span>[Ви / CH 19]:</span> ${escapeHtml(text)}`);
                messageInput.value = '';
                playRadioBeep();
                closeMic();
            }
        }

        sendBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sendMessage();
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Закриття при кліку поза мікрофоном/панеллю
        document.addEventListener('click', (e) => {
            if (isExpanded && !micContainer.contains(e.target) && !chatPanel.contains(e.target)) {
                closeMic();
            }
        });

        function addLog(htmlText) {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = htmlText;
            logBox.appendChild(item);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function playRadioBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.12);
            } catch (err) {}
        }
    </script>
</body>
</html>
