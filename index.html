<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uniden Bearcat 980SSB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e12;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .main-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        /* КОРПУС РАЦІЇ */
        .radio-frame {
            position: relative;
            width: 100%;
            height: 220px;
            background: #141619;
            border-radius: 8px;
            border: 3px solid #3a3f47;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            display: flex;
            padding: 6px;
            user-select: none;
            overflow: hidden; /* Запобігає вилазанню елементів */
        }

        .radio-face {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1b1d22 0%, #0f1013 100%);
            border: 2px solid #5a606a;
            border-radius: 5px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
        }

        .screw {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #444;
            border-radius: 50%;
            border: 1px solid #777;
            z-index: 5;
        }
        .screw.top-left { top: 3px; left: 3px; }
        .screw.top-right { top: 3px; right: 3px; }
        .screw.bottom-left { bottom: 3px; left: 3px; }
        .screw.bottom-right { bottom: 3px; right: 3px; }

        /* ЛІВА ПАНЕЛЬ */
        .controls-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            width: 65px;
            flex-shrink: 0;
            z-index: 2;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 13px;
            color: #d8dde6;
            letter-spacing: 0.5px;
        }

        .dual-knob-container {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .knob-outer-ring {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2.5px solid #ff7700;
            box-shadow: 0 0 6px rgba(255, 119, 0, 0.7);
        }
        .knob-base {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #3a3a3a 0%, #151515 80%);
            border-radius: 50%;
            border: 2px solid #555;
            position: relative;
        }
        .knob-notch {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 10px;
            background-color: #fff;
            border-radius: 1px;
        }

        .knob-sub {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle, #2a2a2a 0%, #111 100%);
            border-radius: 50%;
            border: 1px solid #666;
        }

        .knob-label {
            font-size: 6.5px;
            color: #aaa;
            font-family: monospace;
            text-align: center;
        }

        /* ЦЕНТРАЛЬНИЙ ДИСПЛЕЙ */
        .display-center {
            flex-grow: 1;
            height: 100%;
            background-color: #050607;
            border: 2px solid #2d323b;
            border-radius: 4px;
            margin: 0 6px;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(255, 120, 0, 0.15);
            min-width: 0; /* Для коректного стискання */
        }

        .disp-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bearcat-title {
            font-size: 10px;
            color: #ff9d00;
            font-weight: bold;
        }

        .disp-main-content {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .signal-meter {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .meter-bars-row {
            display: flex;
            align-items: flex-end;
            gap: 2px;
        }
        .m-bar {
            width: 5px;
            background-color: #2b1800;
            border-radius: 1px;
        }
        .m-bar.active {
            background-color: #ff8800;
            box-shadow: 0 0 4px rgba(255, 136, 0, 0.8);
        }
        .m-bar:nth-child(1) { height: 5px; }
        .m-bar:nth-child(2) { height: 8px; }
        .m-bar:nth-child(3) { height: 11px; }
        .m-bar:nth-child(4) { height: 14px; }
        .m-bar:nth-child(5) { height: 17px; }
        .m-bar:nth-child(6) { height: 20px; }
        .m-bar:nth-child(7) { height: 23px; }
        .m-bar:nth-child(8) { height: 26px; }

        .meter-subtext {
            font-size: 7px;
            color: #ff8800;
            font-family: monospace;
            display: flex;
            gap: 6px;
        }

        .channel-display {
            font-family: 'Courier New', monospace;
            font-size: 52px;
            font-weight: 900;
            color: #ff8800;
            text-shadow: 0 0 10px rgba(255, 136, 0, 0.8);
            line-height: 44px;
        }

        .disp-status-row {
            display: flex;
            gap: 5px;
            font-size: 7px;
            font-family: monospace;
            color: #ff9d00;
        }
        .status-tag { opacity: 0.3; }
        .status-tag.active { opacity: 1; text-shadow: 0 0 3px #ff9d00; }

        .bottom-buttons-row {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #222;
            padding-top: 3px;
            gap: 2px;
        }
        .btn-cap {
            background: linear-gradient(to bottom, #2b2e33, #18191c);
            border: 1px solid #444;
            border-radius: 2px;
            color: #ccc;
            font-size: 6px;
            font-weight: bold;
            padding: 2px 1px;
            text-align: center;
            flex-grow: 1;
        }

        /* ПРАВА ПАНЕЛЬ (Виправлена) */
        .controls-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            width: 70px; /* Звужено, щоб не вилазило */
            flex-shrink: 0;
            z-index: 2;
        }

        .channel-encoder {
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-functions {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }
        .side-btn-label {
            font-size: 6px;
            color: #bbb;
            font-family: sans-serif;
            font-weight: bold;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 1px 0;
            border-radius: 2px;
        }

        /* МІКРОФОН */
        .mic-wrapper {
            position: absolute;
            left: -35px;
            bottom: -15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 15;
            transform-origin: bottom center;
        }

        .mic-body {
            width: 50px;
            height: 95px;
            background: linear-gradient(145deg, #2a2d32 0%, #111215 100%);
            border: 2px solid #4a5059;
            border-radius: 22px 22px 10px 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }

        .mic-grille-mesh {
            width: 32px;
            height: 38px;
            background: repeating-linear-gradient(
                0deg,
                #0a0b0c,
                #0a0b0c 3px,
                #22252a 3px,
                #22252a 6px
            );
            border-radius: 6px;
            border: 1px solid #444;
        }

        .mic-ptt-btn {
            width: 26px;
            height: 24px;
            background: linear-gradient(to bottom, #222, #111);
            border: 1.5px solid #555;
            border-radius: 3px;
            margin-top: 8px;
        }

        .mic-wrapper.expanded {
            transform: scale(1.35) translate(35px, -25px);
        }
        .mic-wrapper.expanded .mic-body {
            border-color: #ff8800;
            box-shadow: 0 10px 30px rgba(255, 136, 0, 0.45);
        }
        .mic-wrapper.expanded .mic-ptt-btn {
            background: linear-gradient(to bottom, #ff8800, #cc6600);
            border-color: #ffaa00;
        }

        /* ПАНЕЛЬ ВВЕДЕННЯ */
        .chat-overlay {
            position: absolute;
            left: 50px;
            bottom: 15px;
            background: #15171c;
            border: 2px solid #ff8800;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            gap: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.85);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 30;
            width: 240px;
        }

        .chat-overlay.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .chat-input-field {
            flex-grow: 1;
            background: #090a0c;
            border: 1px solid #3a3f47;
            border-radius: 4px;
            color: #fff;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }
        .chat-input-field:focus { border-color: #ff8800; }

        .send-btn-action {
            background: #ff8800;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        /* ЖУРНАЛ */
        .radio-log {
            width: 100%;
            background: #101216;
            border: 2px solid #252830;
            border-radius: 8px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #bbb;
        }
        .log-entry {
            margin-bottom: 4px;
            border-left: 3px solid #ff8800;
            padding-left: 6px;
        }
        .log-entry span { color: #ff8800; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="radio-frame">
            <div class="radio-face">
                <div class="screw top-left"></div>
                <div class="screw top-right"></div>
                <div class="screw bottom-left"></div>
                <div class="screw bottom-right"></div>

                <!-- МІКРОФОН ЗЛІВА -->
                <div class="mic-wrapper" id="micWrapper">
                    <div class="mic-body">
                        <div class="mic-grille-mesh"></div>
                        <div class="mic-ptt-btn"></div>
                    </div>
                </div>

                <!-- ПОЛЕ ВВЕДЕННЯ -->
                <div class="chat-overlay" id="chatOverlay">
                    <input type="text" id="msgInput" class="chat-input-field" placeholder="Повідомлення (канал 19)..." />
                    <button class="send-btn-action" id="sendBtn">OK</button>
                </div>

                <!-- ЛІВА ПАНЕЛЬ -->
                <div class="controls-left">
                    <div class="brand-logo">Uniden</div>
                    <div class="dual-knob-container">
                        <div class="knob-outer-ring"></div>
                        <div class="knob-base">
                            <div class="knob-notch"></div>
                        </div>
                    </div>
                    <div class="knob-label">VOL - SQ</div>
                    <div class="knob-sub"></div>
                    <div class="knob-label">FINE/COARSE</div>
                </div>

                <!-- ДИСПЛЕЙ -->
                <div class="display-center">
                    <div class="disp-top-bar">
                        <span class="bearcat-title">🐾 Bearcat 980SSB</span>
                    </div>

                    <div class="disp-main-content">
                        <div class="signal-meter">
                            <div class="meter-bars-row">
                                <div class="m-bar active"></div>
                                <div class="m-bar active"></div>
                                <div class="m-bar active"></div>
                                <div class="m-bar active"></div>
                                <div class="m-bar active"></div>
                                <div class="m-bar active"></div>
                                <div class="m-bar"></div>
                                <div class="m-bar"></div>
                            </div>
                            <div class="meter-subtext">
                                <span>S/RF</span>
                                <span>-30 dB</span>
                            </div>
                        </div>

                        <div class="channel-display">19</div>
                    </div>

                    <div class="disp-status-row">
                        <span class="status-tag active">S/RF</span>
                        <span class="status-tag active">ALERT</span>
                        <span class="status-tag">MEM</span>
                        <span class="status-tag active">SCAN</span>
                        <span class="status-tag active">ANL</span>
                        <span class="status-tag active">NB</span>
                    </div>

                    <div class="bottom-buttons-row">
                        <div class="btn-cap">S/RF/CAL/SWR</div>
                        <div class="btn-cap">CB/PA</div>
                        <div class="btn-cap">MEM/SCAN</div>
                        <div class="btn-cap">9/19/NORM</div>
                        <div class="btn-cap">AM/FM</div>
                        <div class="btn-cap">ANL/NB</div>
                    </div>
                </div>

                <!-- ПРАВА ПАНЕЛЬ (ВИПРАВЛЕНА) -->
                <div class="controls-right">
                    <div class="channel-encoder">
                        <div class="knob-outer-ring"></div>
                        <div class="knob-base">
                            <div class="knob-notch"></div>
                        </div>
                    </div>
                    
                    <div class="side-functions">
                        <div class="side-btn-label">TALKBACK</div>
                        <div class="side-btn-label">MIC GAIN</div>
                        <div class="side-btn-label">WEATHER</div>
                        <div class="side-btn-label">DAY/NIGHT</div>
                    </div>

                    <div class="knob-sub"></div>
                    <div class="knob-label">RF GAIN</div>
                </div>
            </div>
        </div>

        <!-- ЖУРНАЛ -->
        <div class="radio-log" id="radioLog">
            <div class="log-entry"><span>[Система]:</span> CB-рація Uniden 980SSB готова до роботи. Канал 19 (27.185 MHz).</div>
        </div>
    </div>

    <script>
        const micWrapper = document.getElementById('micWrapper');
        const chatOverlay = document.getElementById('chatOverlay');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const radioLog = document.getElementById('radioLog');

        let isMicOpen = false;

        micWrapper.addEventListener('click', (e) => {
            e.stopPropagation();
            isMicOpen = !isMicOpen;

            if (isMicOpen) {
                micWrapper.classList.add('expanded');
                chatOverlay.classList.add('active');
                msgInput.focus();
                addLog("Мікрофон знято з тримача. Ефір відкрито.");
                playBeepSound();
            } else {
                closeMic();
            }
        });

        function closeMic() {
            isMicOpen = false;
            micWrapper.classList.remove('expanded');
            chatOverlay.classList.remove('active');
            addLog("Мікрофон повернуто.");
        }

        function transmitMessage() {
            const text = msgInput.value.trim();
            if (text) {
                addLog(`<span>[Ви / 19 Канал]:</span> ${escapeHtml(text)}`);
                msgInput.value = '';
                playBeepSound();
                closeMic();
            }
        }

        sendBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            transmitMessage();
        });

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                transmitMessage();
            }
        });

        document.addEventListener('click', (e) => {
            if (isMicOpen && !micWrapper.contains(e.target) && !chatOverlay.contains(e.target)) {
                closeMic();
            }
        });

        function addLog(textHtml) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = textHtml;
            radioLog.appendChild(entry);
            radioLog.scrollTop = radioLog.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1300, ctx.currentTime);

                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.14);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.14);
            } catch (err) {}
        }
    </script>
</body>
</html>
